[package]
name = "rust-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
argon2 = { version = "0.5.3", features = ["std"] }
dotenvy = "0.15.7"
jsonwebtoken = {version = "11.0.0", features = ["rust_crypto"]}
redis = { version = "1.4.1", features = ["tokio-comp"] }
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid"] }
thiserror = "2.0.19"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "5.5.0", features = ["actix_extras"] }
utoipa-actix-web = "0.1.2"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }

[workspace.lints.clippy]
pedantic = "warn"
